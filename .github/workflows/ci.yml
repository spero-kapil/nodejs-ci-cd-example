name: Deploy to Local Apache Server

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment directory
        run: |
          test -d /var/www/Projects/Learning/node-ci-cd
          test -w /var/www/Projects/Learning/node-ci-cd

      - name: Deploy staging release
        run: ./deploy.sh

      - name: Verify website responds
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/